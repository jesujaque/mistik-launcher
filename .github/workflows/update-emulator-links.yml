name: Update Emulator Links

on:
  schedule:
    - cron: "0 6 * * 1" # Todos los lunes a las 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-emulator-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update emulator download links
        run: python .github/scripts/update_emulator_links.py

      - name: Commit updated links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mistik-launcher-code.py mistik-launcher-code-AC-EDITION.py .github/
          if git diff --cached --quiet; then
            echo "No se detectaron cambios en los enlaces de descarga."
          else
            git commit -m "ci: actualizar enlaces de descarga de emuladores a la última release"
            git push
          fi
